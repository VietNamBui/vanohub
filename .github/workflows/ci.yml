name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vanohub_test
          POSTGRES_USER: vanohub
          POSTGRES_PASSWORD: vanohub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-not-for-production-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_SSL_REDIRECT: "False"
      POSTGRES_DB: vanohub_test
      POSTGRES_USER: vanohub
      POSTGRES_PASSWORD: vanohub_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Pipenv and dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev --system

      - name: Lint (Ruff)
        run: ruff check backend

      - name: Static type checking (Pyright)
        run: pyright

      - name: Django system & migration checks
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Django tests
        working-directory: backend
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
