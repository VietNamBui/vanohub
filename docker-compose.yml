services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      # Nếu cổng 5432 đã bị chiếm: đổi thành "5433:5432" và POSTGRES_PORT=5433 trong backend/.env
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
